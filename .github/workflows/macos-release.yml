name: macOS release

on:
  push:
    branches: [macos-release]
    tags: [macos-v*]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          lfs: true

      - name: Install build tools
        run: brew install cmake ninja wxwidgets glew pkgconf directx-headers git-lfs

      - name: Fetch large resources
        run: git lfs pull

      - name: Build
        run: |
          cmake -S . -B build/macos -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DBSOS_ENABLE_FBXSDK=OFF -DBSOS_ENABLE_BULLET=OFF -DBSOS_ENABLE_OPENEXR=OFF
          cmake --build build/macos --target BodySlide OutfitStudio --parallel 3

      - name: Package self-contained apps
        run: |
          python3 scripts/package_macos.py \
            --build-dir build/macos \
            --app 'dist/BodySlide-macOS-arm64/BodySlide macOS.app'
          python3 scripts/verify_macos_package.py dist/BodySlide-macOS-arm64
          ditto -c -k --sequesterRsrc --keepParent dist/BodySlide-macOS-arm64 dist/BodySlide-macOS-arm64.zip
          shasum -a 256 dist/BodySlide-macOS-arm64.zip > dist/BodySlide-macOS-arm64.zip.sha256

      - name: Upload build
        uses: actions/upload-artifact@v7
        with:
          name: BodySlide-macOS-arm64
          path: |
            dist/BodySlide-macOS-arm64.zip
            dist/BodySlide-macOS-arm64.zip.sha256
          if-no-files-found: error

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/macos-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/BodySlide-macOS-arm64.zip \
            dist/BodySlide-macOS-arm64.zip.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --title "BodySlide and Outfit Studio for macOS $GITHUB_REF_NAME" \
            --notes-file RELEASE-macOS.md
